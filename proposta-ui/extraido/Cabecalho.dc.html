<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="width:1440px;background:#fff;font-family:'Open Sans',sans-serif;font-size:16px">
  <div style="background:#063560;height:60px;padding:0 48px;display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:32px">
      <a href="mailto:apae@apaelimeira.org.br" style="color:#fff;text-decoration:underline;min-height:44px;display:flex;align-items:center" style-hover="color:#F5AB32">apae@apaelimeira.org.br</a>
      <a href="tel:+551934041569" style="color:#fff;text-decoration:underline;min-height:44px;display:flex;align-items:center" style-hover="color:#F5AB32">(19) 3404-1569</a>
    </div>
    <a href="#" style="display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 32px;background:#FF448D;color:#04223F;font:800 16px Montserrat,sans-serif;border-radius:6px;text-decoration:none" style-hover="background:#FF6AA3">Doe agora</a>
  </div>
  <div style="padding:14px 48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #DDE2E7">
    <div style="width:260px;height:72px;box-sizing:border-box;background:repeating-linear-gradient(135deg,#D6DADF 0 14px,#CDD2D8 14px 28px);color:#33383E;font:500 16px/1.3 ui-monospace,Menlo,monospace;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 12px">logo APAE Limeira – 60 anos</div>
    <nav style="display:flex;align-items:center;gap:6px">
      <sc-for list="{{ itens }}" as="it" hint-placeholder-count="8">
        <a href="#" style="display:flex;align-items:center;min-height:52px;padding:0 12px;box-sizing:border-box;white-space:nowrap;font:600 16px Montserrat,sans-serif;color:#063560;text-decoration:none;border-bottom:5px solid {{ it.linha }}" style-hover="border-bottom-color:#F5AB32">{{ it.nome }}</a>
      </sc-for>
    </nav>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:140},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? '';
    const nomes = ['Home','Quem Somos','Programas','Projetos','Serviços','Eventos','Transparência','Contato/Ouvidoria'];
    return { itens: nomes.map(n => ({ nome: n, linha: n === a ? '#F5AB32' : 'transparent' })) };
  }
}
</script>
</body>
</html>
