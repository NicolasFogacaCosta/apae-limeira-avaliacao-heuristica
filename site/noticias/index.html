<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOTÍCIAS – APAE Limeira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Engagement&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Roboto:wght@400;500;700&family=Rubik:wght@300;400&family=Sansita:wght@400;700&display=swap">
<link rel="stylesheet" href="../assets/css/estilo.css">
</head>
<body class="pagina-interna pagina-noticias">
<script src="../assets/js/layout.js" data-parte="cabecalho"></script>
<main id="conteudo" class="pagina">
  <header class="pagina__topo">
    <h1 class="pagina__titulo">NOTÍCIAS</h1>
    <div class="pagina__divisor"></div>
  </header>
  <div class="container pagina__conteudo noticias">
    <!-- Achado 23: seção de notícias acessível pela navegação, com data completa e categoria -->
    <p class="noticias__intro">Todas as publicações da APAE de Limeira, da mais recente para a mais antiga.</p>
    <fieldset class="noticias__filtro">
      <legend>Mostrar</legend>
      <label><input type="radio" name="categoria" value="" checked> Todas</label>
      <label><input type="radio" name="categoria" value="Notícias"> Notícias</label>
      <label><input type="radio" name="categoria" value="Eventos"> Eventos</label>
      <label><input type="radio" name="categoria" value="Programas"> Programas</label>
    </fieldset>
    <p class="noticias__contagem" data-contagem aria-live="polite"></p>
    <ul class="noticias__lista" data-lista></ul>
    <nav class="noticias__paginas" data-paginas aria-label="Páginas de notícias"></nav>
    <noscript><p>Para ver a lista de notícias, ative o JavaScript ou use a <a href="../busca/">busca do site</a>.</p></noscript>
  </div>
</main>
<section class="compartilhe">
  <div class="container compartilhe__inner">
    <h2 class="compartilhe__titulo">Compartilhe:</h2>
    <div class="compartilhe__botoes" data-compartilhar>
      <a class="compartilhe__btn compartilhe__btn--facebook" data-rede="facebook" role="button" tabindex="0">Facebook</a>
      <a class="compartilhe__btn compartilhe__btn--whatsapp" data-rede="whatsapp" role="button" tabindex="0">WhatsApp</a>
      <a class="compartilhe__btn compartilhe__btn--twitter" data-rede="twitter" role="button" tabindex="0">Twitter</a>
      <a class="compartilhe__btn compartilhe__btn--pinterest" data-rede="pinterest" role="button" tabindex="0">Pinterest</a>
      <a class="compartilhe__btn compartilhe__btn--linkedin" data-rede="linkedin" role="button" tabindex="0">LinkedIn</a>
    </div>
  </div>
</section>
<script src="../assets/js/layout.js" data-parte="rodape"></script>
<script src="../assets/js/principal.js"></script>
<script src="../assets/js/busca-indice.js"></script>
<script src="../assets/js/noticias.js"></script>
</body>
</html>
